spring.application.name=AssetFlow

# DataSource (MariaDB)
spring.datasource.url=jdbc:mariadb://localhost:3306/assetflow?useUnicode=true&characterEncoding=utf8mb4
spring.datasource.username=${DB_USER:assetflow}
spring.datasource.password=${DB_PASSWORD:assetflow123}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.assetflow.model
mybatis.configuration.map-underscore-to-camel-case=true

# JSP 뷰 리졸버
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 파일 업로드
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# 앱 설정
app.stock-cache.ttl-minutes=30
app.openrouter.api-key=${OPENROUTER_API_KEY:}
app.openrouter.model=anthropic/claude-opus-4
